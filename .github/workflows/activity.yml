name: Refresh GitHub activity

on:
  schedule:
    - cron: "23 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/activity.yml"
      - "scripts/update_activity.py"
      - "tests/test_update_activity.py"

permissions:
  contents: write

concurrency:
  group: profile-activity
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'RayZh-hs/RayZh-hs'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the profile
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Test the activity updater
        run: python3 -m unittest discover -s tests

      - name: Refresh recent public activity
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/update_activity.py

      - name: Commit changes when activity has changed
        run: |
          if git diff --quiet -- README.md; then
            echo "Activity is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: refresh recent GitHub activity"
          git push
